_readme: 'The angle inventory. An angle may only be applied to a story whose SUBJECT is in
  its scope. Edit freely: delete positions that are not yours, tighten a scope that is catching
  the wrong stories, set enabled: false to retire one without losing it. narrative_desk.py
  reads this file and records which angle each card used, so when a card picks badly you can
  point at the row.'
