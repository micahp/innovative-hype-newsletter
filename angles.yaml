_readme: 'The angle inventory. Generated by scripts/extract_angles.py then scripts/consolidate_angles.py,
  and edited by hand after that. An angle fires on a story whose SUBJECT matches it, by embedding
  similarity against claim + subject + scope, not by keyword. Edit freely: delete positions
  that are not yours, rewrite a subject that is catching the wrong stories, set enabled: false
  to retire one without losing it. decisions.json records the angle offered on every cluster
  with its score, so when a card picks badly you can point at the row and the number.'
